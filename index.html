<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preço e Margem por Marketplace</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e3e1da;--acc:#0f7b6c;--accbg:#e1f2ee;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1e;--ink:#efede8;--mute:#9b9992;--line:#34322f;--acc:#4cc2ad;--accbg:#173631;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#161615;--card:#201f1e;--ink:#efede8;--mute:#9b9992;--line:#34322f;--acc:#4cc2ad;--accbg:#173631;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--acc)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:12px}
td input{width:84px;text-align:right}
.pr{font-weight:600}
.cc{cursor:pointer;text-decoration:underline dotted var(--mute);text-underline-offset:3px}
.neg{color:var(--bad)}
.empty{color:var(--mute);margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.modal{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:360px}
.modal h2{margin:0 0 12px;font-size:18px}
.modal .row{margin-bottom:12px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.err{color:var(--bad);font-size:13px;margin:0 0 8px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--accbg)}
.vh{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.drop img{display:block;max-width:100%;max-height:140px;margin:0 auto 8px;border-radius:8px}
.drop img[hidden]{display:none}
.th{display:block;width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer}
.th.ph{background:var(--line)}
</style>
</head>
<body>
<main>
<div class="top">
<h1>Preço e Margem</h1>
<button class="btn" id="add" type="button">+ Adicionar produto</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="st" class="empty"></div>

<section class="card">
<h2 id="feeTitle">Taxas</h2>
<div class="grid">
<div><label for="fcom">Comissão (%)</label><input id="fcom" inputmode="decimal"></div>
<div><label for="ffix">Taxa fixa por venda (R$)</label><input id="ffix" inputmode="decimal"></div>
<div><label for="fimp">Imposto (%)</label><input id="fimp" inputmode="decimal"></div>
</div>
</section>

<section class="card">
<h2>Produtos</h2>
<div id="list"></div>
</section>
</main>

<input type="file" id="rimg" accept="image/*" class="vh">
<div class="ov" id="ov" hidden>
<div class="modal">
<h2>Novo produto</h2>
<div class="row"><label class="drop" id="drop" for="nimg"><img id="prev" alt="" hidden><span id="dtxt">Arraste uma imagem aqui ou clique para escolher</span></label><input type="file" id="nimg" accept="image/*" class="vh"></div>
<div class="row"><label for="nsku">SKU</label><input id="nsku" autocomplete="off"></div>
<div class="row"><label for="ncusto">Custo (R$)</label><input id="ncusto" inputmode="decimal" autocomplete="off"></div>
<p class="err" id="err" hidden></p>
<div class="acts">
<button class="btn ghost" id="cancel" type="button">Cancelar</button>
<button class="btn" id="ok" type="button">Adicionar</button>
</div>
</div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const SUPABASE_URL='https://chthfkbrkcwgcsijwjix.supabase.co';
const SUPABASE_KEY='sb_publishable_Ba6WkpXJ6aHNNwrvjJqDHw_h1F6bQB6';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('COLE')&&!SUPABASE_KEY.includes('COLE');
const BUCKET='produtos', DEF_M=20;
const $=id=>document.getElementById(id);
const MK=[{k:'tiktok',n:'TikTok Shop'},{k:'shopee',n:'Shopee'},{k:'ml',n:'Mercado Livre'}];
let fees={tiktok:{com:6,fix:0,imp:0},shopee:{com:20,fix:4,imp:0},ml:{com:14,fix:6,imp:0}};
let products=[],tab='tiktok',newImg='',newBlob=null,rowIdx=-1;
const sb=configured?createClient(SUPABASE_URL,SUPABASE_KEY):null;
const num=v=>{const x=parseFloat(String(v).trim().replace(',','.'));return isFinite(x)?x:0};
const brl=v=>isFinite(v)?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=t=>{$('st').textContent=t};
async function run(p){say('Salvando…');const {error}=await p;say(error?'Erro ao salvar: '+error.message:'Salvo ✓');return !error}
const timers={};
const later=(k,fn)=>{clearTimeout(timers[k]);timers[k]=setTimeout(fn,500)};
const pub=path=>path?sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl:'';
const toP=r=>({id:r.id,sku:r.sku,custo:Number(r.custo),path:r.img_path,img:pub(r.img_path),m:r.margens||{}});

function calc(p){
 const f=fees[tab],m=(p.m[tab]!=null?p.m[tab]:DEF_M)/100,d=1-f.com/100-f.imp/100-m;
 if(d<=0)return {price:NaN,profit:NaN};
 const price=(p.custo+f.fix)/d;return {price,profit:price*m};
}
function drawTabs(){
 $('tabs').innerHTML=MK.map(m=>`<button class="tab${m.k===tab?' on':''}" data-k="${m.k}" type="button"${configured?'':' disabled'}>${m.n}</button>`).join('');
 $('feeTitle').textContent='Taxas — '+MK.find(m=>m.k===tab).n;
 const f=fees[tab];$('fcom').value=f.com;$('ffix').value=f.fix;$('fimp').value=f.imp;
 ['fcom','ffix','fimp'].forEach(id=>$(id).disabled=!configured);
}
function drawList(){
 const el=$('list');
 if(!products.length){el.innerHTML=`<p class="empty">${configured?'Nenhum produto ainda. Clique em “Adicionar produto”.':'Configure o Supabase para começar.'}</p>`;return}
 el.innerHTML='<div class="tw"><table><thead><tr><th></th><th>SKU</th><th>Custo</th><th>Margem (%)</th><th>Preço de venda</th><th>Lucro</th><th></th></tr></thead><tbody>'+
 products.map((p,i)=>{const r=calc(p),m=p.m[tab]!=null?p.m[tab]:DEF_M;
  return `<tr data-i="${i}"><td>${p.img?`<img class="th" title="Trocar imagem" src="${esc(p.img)}" alt="">`:'<span class="th ph" title="Adicionar imagem"></span>'}</td><td class="cc sku" title="Clique para editar">${esc(String(p.sku).toUpperCase())}</td><td class="cc" title="Clique para editar">${brl(p.custo)}</td><td><input class="mi" inputmode="decimal" value="${Number(m).toFixed(2)}"></td><td class="pr" data-c="price"><input class="pi" inputmode="decimal" value="${Number.isFinite(r.price)?r.price.toFixed(2):''}"></td><td data-c="profit">${brl(r.profit)}</td><td><button class="btn ghost del" type="button">Remover</button></td></tr>`}).join('')+'</tbody></table></div>';
}
function updateRow(tr){const p=products[+tr.dataset.i];const r=calc(p);const pi=tr.querySelector('.pi');if(pi)pi.value=Number.isFinite(r.price)?r.price.toFixed(2):'';tr.querySelector('[data-c=profit]').textContent=brl(r.profit);const mi=tr.querySelector('.mi');if(mi && p.m[tab]!=null)mi.value=Number(p.m[tab]).toFixed(2)}

async function load(){
 if(!configured){$('add').disabled=true;say('Configure a URL e a chave pública do Supabase no início do script (veja o LEIA-ME).');drawTabs();drawList();return}
 say('Carregando…');
 const a=await sb.from('products').select('*').order('created_at',{ascending:false});
 const f=await sb.from('fees').select('*');
 if(a.error||f.error){say('Erro ao carregar: '+(a.error||f.error).message);return}
 products=a.data.map(toP);
 f.data.forEach(r=>{fees[r.marketplace]={com:Number(r.com),fix:Number(r.fix),imp:Number(r.imp)}});
 say('');drawTabs();drawList();
}

$('tabs').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){tab=k;drawTabs();drawList()}});
['fcom','ffix','fimp'].forEach(id=>$(id).addEventListener('input',()=>{
 const k=tab;fees[k]={com:num($('fcom').value),fix:num($('ffix').value),imp:num($('fimp').value)};
 drawList();const f=fees[k];
 later('fee'+k,()=>run(sb.from('fees').upsert({marketplace:k,com:f.com,fix:f.fix,imp:f.imp})));
}));
$('list').addEventListener('input',e=>{
 const tr=e.target.closest('tr');
 if(!tr)return;
 const p=products[+tr.dataset.i];
 if(e.target.classList.contains('mi')){
  p.m={...p.m,[tab]:num(e.target.value)};updateRow(tr);
  const id=p.id,m=p.m;later('m'+id,()=>run(sb.from('products').update({margens:m}).eq('id',id)));
 }
});
$('list').addEventListener('change',e=>{
 const tr=e.target.closest('tr');
 if(!tr)return;
 const p=products[+tr.dataset.i];
 if(!e.target.classList.contains('pi'))return;
 const price=num(e.target.value);
 if(price>0){
  const f=fees[tab];
  const margem=1-f.com/100-f.imp/100-(p.custo+f.fix)/price;
  p.m={...p.m,[tab]:Math.max(0,margem*100)};updateRow(tr);
  const id=p.id,m=p.m;later('m'+id,()=>run(sb.from('products').update({margens:m}).eq('id',id)));
 } else {
  updateRow(tr);
 }
});
$('list').addEventListener('click',async e=>{
 const t=e.target;
 if(t.classList.contains('cc')){
  const td=t.closest('td');
  if(td && td.classList.contains('sku')){editSku(t);return}
  editCost(t);return
 }
 if(t.classList.contains('th')){rowIdx=+t.closest('tr').dataset.i;$('rimg').click();return}
 if(!t.classList.contains('del'))return;
 const i=+t.closest('tr').dataset.i,p=products[i];
 if(!confirm('Remover '+p.sku+'?'))return;
 if(await run(sb.from('products').delete().eq('id',p.id))){
  if(p.path)sb.storage.from(BUCKET).remove([p.path]);
  products.splice(i,1);drawList();
 }
});
function editCost(td){
 if(td.querySelector('input'))return;
 const p=products[+td.closest('tr').dataset.i];
 const inp=document.createElement('input');
 inp.setAttribute('inputmode','decimal');inp.value=String(p.custo).replace('.',',');
 td.textContent='';td.appendChild(inp);inp.focus();inp.select();
 let done=false;
 const fin=ok=>{
  if(done)return;done=true;
  const v=num(inp.value);
  if(ok&&v>0&&v!==p.custo){p.custo=v;run(sb.from('products').update({custo:v}).eq('id',p.id))}
  drawList();
 };
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')fin(true);else if(e.key==='Escape')fin(false)});
 inp.addEventListener('blur',()=>fin(true));
}
function editSku(td){
 if(td.querySelector('input'))return;
 const p=products[+td.closest('tr').dataset.i];
 const inp=document.createElement('input');
 inp.setAttribute('inputmode','text');
 inp.value=String(p.sku).toUpperCase();
 td.textContent='';td.appendChild(inp);inp.focus();inp.select();
 let done=false;
 const fin=ok=>{
  if(done)return;done=true;
  const v=inp.value.trim().toUpperCase();
  if(ok&&v&&v!==p.sku){p.sku=v;run(sb.from('products').update({sku:v}).eq('id',p.id))}
  drawList();
 };
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')fin(true);else if(e.key==='Escape')fin(false)});
 inp.addEventListener('blur',()=>fin(true));
}

function showPrev(){
 const im=$('prev');
 if(newImg){im.src=newImg;im.hidden=false;$('dtxt').textContent='Clique ou arraste para trocar a imagem'}
 else{im.removeAttribute('src');im.hidden=true;$('dtxt').textContent='Arraste uma imagem aqui ou clique para escolher'}
}
const setNew=(b,d)=>{newBlob=b;newImg=d;showPrev()};
const bad=()=>{$('dtxt').textContent='Não consegui ler essa imagem. Tente um JPG ou PNG.'};
function handleFile(f,cb){
 if(!f||f.type.indexOf('image/')!==0)return;
 const rd=new FileReader();rd.onerror=bad;
 rd.onload=()=>{const im=new Image();im.onerror=bad;
  im.onload=()=>{
   const s=Math.min(1,480/Math.max(im.width,im.height)),cv=document.createElement('canvas');
   cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
   cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
   cv.toBlob(b=>cb(b,cv.toDataURL('image/jpeg',0.85)),'image/jpeg',0.85);
  };im.src=rd.result};
 rd.readAsDataURL(f);
}
async function upload(blob){
 const path=crypto.randomUUID()+'.jpg';
 const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
 if(error){say('Erro na imagem: '+error.message);return null}
 return path;
}
$('nimg').addEventListener('change',function(){handleFile(this.files[0],setNew)});
const dz=document.querySelector('.modal');
['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('over')}));
function urlFromDT(dt){
 const h=dt.getData('text/html'),m=h&&h.match(/<img[^>]+src=["']([^"']+)["']/i);
 if(m)return m[1].replace(/&amp;/g,'&');
 const l=(dt.getData('text/uri-list')||'').split('\n').find(x=>x&&x[0]!=='#');
 return (l||dt.getData('text/plain')||'').trim();
}
async function fromUrl(u,cb){
 if(u.startsWith('//'))u='https:'+u;
 if(!/^(https?:|data:image\/)/i.test(u)){$('dtxt').textContent='Isso não parece uma imagem. Tente copiar a imagem e colar com Ctrl+V.';return}
 $('dtxt').textContent='Baixando imagem…';
 try{
  let r;
  if(u.startsWith('data:'))r=await fetch(u);
  else{try{r=await fetch(u);if(!r.ok)throw 0}catch(x){r=await fetch('/api/img?url='+encodeURIComponent(u))}}
  if(!r.ok)throw new Error('http');
  const b=await r.blob();
  if(!b.type.startsWith('image/'))throw new Error('tipo');
  handleFile(new File([b],'img',{type:b.type}),cb);
 }catch(x){$('dtxt').textContent='Não consegui baixar essa imagem. Salve no computador e arraste o arquivo, ou copie a imagem e cole com Ctrl+V.'}
}
dz.addEventListener('drop',e=>{
 const dt=e.dataTransfer;if(!dt)return;
 if(dt.files&&dt.files[0]){handleFile(dt.files[0],setNew);return}
 const u=urlFromDT(dt);
 if(u)fromUrl(u,setNew);else $('dtxt').textContent='Não encontrei uma imagem nesse arraste. Tente copiar a imagem e colar com Ctrl+V.';
});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
document.addEventListener('paste',e=>{if($('ov').hidden)return;const fl=e.clipboardData&&e.clipboardData.files;if(fl&&fl[0])handleFile(fl[0],setNew)});
$('rimg').addEventListener('change',function(){
 const i=rowIdx;
 handleFile(this.files[0],async b=>{
  const p=products[i];if(!p)return;
  const path=await upload(b);if(!path)return;
  const old=p.path;
  if(await run(sb.from('products').update({img_path:path}).eq('id',p.id))){
   p.path=path;p.img=pub(path);if(old)sb.storage.from(BUCKET).remove([old]);drawList();
  }
 });
});
$('nsku').addEventListener('input',function(){const s=this.selectionStart;this.value=this.value.toUpperCase();try{this.setSelectionRange(s,s)}catch(x){}});

function openM(){newImg='';newBlob=null;showPrev();$('nsku').value='';$('ncusto').value='';$('err').hidden=true;$('ov').hidden=false;setTimeout(()=>$('nsku').focus(),30)}
function closeM(){$('ov').hidden=true}
async function addP(){
 const sku=$('nsku').value.trim().toUpperCase(),custo=num($('ncusto').value);
 if(!sku||custo<=0){$('err').textContent='Informe o SKU e um custo maior que zero.';$('err').hidden=false;return}
 $('ok').disabled=true;
 let path=null;
 if(newBlob){path=await upload(newBlob)}
 const {data,error}=await sb.from('products').insert({sku,custo,img_path:path}).select().single();
 $('ok').disabled=false;
 if(error){$('err').textContent='Erro ao salvar: '+error.message;$('err').hidden=false;return}
 products.unshift(toP(data));drawList();closeM();say('Salvo ✓');
}
$('add').addEventListener('click',openM);
$('cancel').addEventListener('click',closeM);
$('ok').addEventListener('click',addP);
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeM()});
$('ncusto').addEventListener('keydown',e=>{if(e.key==='Enter')addP()});
load();
</script>
</body>
</html>
